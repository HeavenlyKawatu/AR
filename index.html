<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Cyber Defense AR — Literasi Digital &amp; Keamanan Siber</title>

  <!--
    ================================================================
    LIBRARY (via CDN)
    Versi A-Frame 1.5.0 + MindAR 1.2.5 dipilih dengan sengaja karena
    kombinasi ini teruji stabil bersama-sama. Jangan asal upgrade ke
    versi A-Frame terbaru: MindAR seringkali tertinggal dan bisa
    langsung error / marker tidak terdeteksi jika versi tidak cocok.
    ================================================================
  -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    :root {
      --safe: #2ecc71;
      --danger: #ff3b3b;
      --recover: #2f9bff;
      --hacker-accent: #39ff14;
      --admin-accent: #29d3ff;
      --panel-bg: rgba(8, 10, 12, 0.72);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #000;
      overflow: hidden;
    }

    a-scene {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    /* ---------- Kontainer overlay UI di atas kamera AR ---------- */
    #ui-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none; /* biar area kosong tidak menghalangi kamera */
    }

    /* ---------- Badge peran (pojok kiri atas) ---------- */
    #role-badge {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 14px;
      padding: 6px 12px;
      font-family: "Courier New", monospace;
      font-size: 13px;
      letter-spacing: 0.02em;
      color: #fff;
      background: var(--panel-bg);
      border-left: 4px solid #888;
      pointer-events: auto;
    }
    #role-badge.role-hacker { border-left-color: var(--hacker-accent); color: var(--hacker-accent); }
    #role-badge.role-admin  { border-left-color: var(--admin-accent);  color: var(--admin-accent); }

    /* ---------- Banner status server (atas, full width) ---------- */
    #status-banner {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 0;
      right: 0;
      margin: 0 auto;
      width: fit-content;
      max-width: 90%;
      padding: 8px 18px;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      background: var(--panel-bg);
      border-bottom: 3px solid var(--safe);
      transition: border-color 0.3s ease;
    }
    #status-banner.status-danger { border-bottom-color: var(--danger); animation: pulse 0.9s ease-in-out infinite; }
    #status-banner.status-recover { border-bottom-color: var(--recover); }
    #status-banner.status-safe { border-bottom-color: var(--safe); }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    /* ---------- Baris debug kecil (opsional, untuk demo ke dosen) ---------- */
    #debug-strip {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      text-align: center;
      font-family: "Courier New", monospace;
      font-size: 11px;
      color: rgba(255,255,255,0.55);
      pointer-events: none;
    }

    /* ---------- Tombol aksi (bawah) ---------- */
    .action-btn {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: max(24px, env(safe-area-inset-bottom));
      padding: 16px 12px;
      font-size: 17px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      color: #061012;
      border: none;
      border-radius: 8px;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active { transform: scale(0.98); }

    .btn-hacker {
      background: var(--hacker-accent);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset;
    }
    .btn-admin {
      background: var(--admin-accent);
      box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset;
    }

    /* ---------- Pesan saat parameter ?role= tidak ada ---------- */
    #no-role-msg {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: max(24px, env(safe-area-inset-bottom));
      padding: 14px 16px;
      font-size: 14px;
      line-height: 1.5;
      color: #fff;
      background: var(--panel-bg);
      border-left: 4px solid #999;
      pointer-events: auto;
    }
    #no-role-msg code {
      background: rgba(255,255,255,0.12);
      padding: 2px 5px;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- ============================================================
       UI OVERLAY — murni HTML/CSS di atas kanvas kamera AR
       ============================================================ -->
  <div id="ui-overlay">
    <div id="role-badge">Memuat peran...</div>
    <div id="status-banner" class="status-safe">🟢 Server Aman</div>
    <div id="debug-strip">DB: attack_active=? | server_health=?</div>

    <button id="btn-hacker" class="action-btn btn-hacker" style="display:none;">
      🦠 Luncurkan Malware
    </button>

    <button id="btn-admin" class="action-btn btn-admin" style="display:none;">
      🛡️ Aktifkan Firewall
    </button>

    <div id="no-role-msg" style="display:none;">
      Peran belum ditentukan. Tambahkan <code>?role=hacker</code> atau
      <code>?role=admin</code> di akhir URL untuk mulai bermain.
    </div>
  </div>

  <!-- ============================================================
       A-FRAME + MINDAR — Scene AR dengan Image Tracking
       ============================================================ -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets></a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- targetIndex: 0 artinya marker PERTAMA di dalam file targets.mind -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Objek 3D "Server Data" -->
      <a-cylinder
        id="server-object"
        position="0 0.2 0"
        radius="0.25"
        height="0.4"
        material="shader: standard; color: #2ecc71; metalness: 0.25; roughness: 0.45"
      ></a-cylinder>

      <!-- Teks status kesehatan server, mengambang di atas objek -->
      <a-text
        id="health-text"
        value="Server Health: 100"
        align="center"
        position="0 0.62 0"
        width="1.6"
        color="#ffffff"
      ></a-text>

    </a-entity>
  </a-scene>

  <!-- ============================================================
       LOGIKA APLIKASI (Firebase + Role + Sinkronisasi Warna)
       ============================================================ -->
  <script type="module">
    // ------------------------------------------------------------
    // 1) FIREBASE SDK 9 (MODULAR) — diimpor langsung dari CDN
    // ------------------------------------------------------------
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue,
      update
    } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // ┌──────────────────────────────────────────────────────────┐
    // │  🔧 GANTI BAGIAN INI DENGAN CONFIG FIREBASE MILIK ANDA   │
    // │  Cara ambil: Firebase Console → ⚙️ Project settings →    │
    // │  General → scroll ke "Your apps" → SDK setup and         │
    // │  configuration → pilih "Config"                          │
    // └──────────────────────────────────────────────────────────┘
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDMZj3Tzbv-he66Obz876r78v40Xwgt8_A",
  authDomain: "cyberdefense-ar.firebaseapp.com",
  databaseURL: "https://cyberdefense-ar-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "cyberdefense-ar",
  storageBucket: "cyberdefense-ar.firebasestorage.app",
  messagingSenderId: "315510447504",
  appId: "1:315510447504:web:1a06af89b9a3a9b1e72715",
  measurementId: "G-0MBNDLS8NH"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const roomRef = ref(db, "room_1"); // root data pertandingan

    // ------------------------------------------------------------
    // 2) DETEKSI ROLE DARI URL (?role=hacker / ?role=admin)
    // ------------------------------------------------------------
    const params = new URLSearchParams(window.location.search);
    const role = params.get("role"); // null | "hacker" | "admin"

    const btnHacker   = document.getElementById("btn-hacker");
    const btnAdmin    = document.getElementById("btn-admin");
    const noRoleMsg   = document.getElementById("no-role-msg");
    const roleBadge   = document.getElementById("role-badge");
    const statusBanner = document.getElementById("status-banner");
    const debugStrip  = document.getElementById("debug-strip");

    if (role === "hacker") {
      btnHacker.style.display = "block";
      roleBadge.textContent = "🦠 PERAN: HACKER";
      roleBadge.classList.add("role-hacker");
    } else if (role === "admin") {
      btnAdmin.style.display = "block";
      roleBadge.textContent = "🛡️ PERAN: ADMIN";
      roleBadge.classList.add("role-admin");
    } else {
      noRoleMsg.style.display = "block";
      roleBadge.textContent = "👁️ MODE PENONTON";
    }

    // ------------------------------------------------------------
    // 3) AKSI TOMBOL → TULIS (WRITE) KE FIREBASE
    // ------------------------------------------------------------
    btnHacker.addEventListener("click", () => {
      // Hacker menyerang: aktifkan status serangan & turunkan kesehatan server
      update(roomRef, {
        attack_active: true,
        server_health: 30
      });
    });

    btnAdmin.addEventListener("click", () => {
      // Admin bertahan: matikan status serangan & pulihkan kesehatan server
      update(roomRef, {
        attack_active: false,
        server_health: 100
      });
    });

    // ------------------------------------------------------------
    // 4) DENGARKAN PERUBAHAN DATA SECARA REAL-TIME (READ / onValue)
    //    Bagian ini yang membuat objek 3D di kedua HP berubah warna
    //    secara bersamaan, walau tombol hanya ditekan di satu HP.
    // ------------------------------------------------------------
    const serverObject = document.querySelector("#server-object");
    const healthText   = document.querySelector("#health-text");

    let previousAttackState = false; // dipakai utk mendeteksi transisi "baru selesai bertahan"
    let blinkInterval = null;

    function stopBlink() {
      if (blinkInterval) {
        clearInterval(blinkInterval);
        blinkInterval = null;
      }
    }

    function setServerColor(hex) {
      serverObject.setAttribute("material", "color", hex);
    }

    onValue(roomRef, (snapshot) => {
      const data = snapshot.val();
      if (!data) return; // node "room_1" belum pernah diisi sama sekali

      const attackActive = !!data.attack_active;
      const health = typeof data.server_health === "number" ? data.server_health : 100;

      healthText.setAttribute("value", `Server Health: ${health}`);
      debugStrip.textContent = `DB: attack_active=${attackActive} | server_health=${health}`;

      if (attackActive) {
        // 🔴 STATE: DISERANG — merah berkedip
        statusBanner.textContent = "🔴 SERVER DISERANG!";
        statusBanner.className = "status-danger";

        stopBlink();
        let isRed = true;
        blinkInterval = setInterval(() => {
          setServerColor(isRed ? "#ff2b2b" : "#7a0000");
          isRed = !isRed;
        }, 400);

      } else {
        stopBlink();

        if (previousAttackState === true) {
          // 🔵 STATE TRANSISI: firewall baru saja diaktifkan
          statusBanner.textContent = "🔵 Firewall Aktif — Memulihkan Server...";
          statusBanner.className = "status-recover";
          setServerColor("#2f9bff");

          setTimeout(() => {
            statusBanner.textContent = "🟢 Server Aman";
            statusBanner.className = "status-safe";
            setServerColor("#2ecc71");
          }, 2500);

        } else {
          // 🟢 STATE: AMAN (baik saat pertama load maupun idle)
          statusBanner.textContent = "🟢 Server Aman";
          statusBanner.className = "status-safe";
          setServerColor("#2ecc71");
        }
      }

      previousAttackState = attackActive;
    });
  </script>
</body>
</html>
